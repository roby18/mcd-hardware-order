<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 96'%3E%3Cg stroke='%23FFC72C' stroke-width='15' fill='none'%3E%3Cpath d='M12 88 C12 30 26 6 42 6 C58 6 68 30 68 88'/%3E%3Cpath d='M52 88 C52 30 66 6 82 6 C98 6 108 30 108 88'/%3E%3C/g%3E%3C/svg%3E">
<title>今日菜单 · 麦门点餐台</title>
<style>
:root{
  --gold:#FFC72C; --gold-d:#E8A800; --gold-s:rgba(255,199,44,.14);
  --red:#DA291C;
  --bg0:#0D0A08; --bg1:#171210; --bg2:#221A15;
  --card:rgba(255,255,255,.045);
  --ink:#FFFFFF; --dim:#A89890; --dim2:#7A6A60;
  --line:rgba(255,199,44,.16);
  --jelly:cubic-bezier(.34,1.42,.48,1);
  --shadow-deep:0 30px 70px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(70% 50% at 50% 8%, rgba(255,199,44,.10) 0%, rgba(255,199,44,0) 62%),
    radial-gradient(90% 70% at 50% 100%, rgba(218,41,28,.10) 0%, rgba(218,41,28,0) 60%),
    linear-gradient(180deg,var(--bg1) 0%, var(--bg0) 55%, #0A0806 100%);
  color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

.app{max-width:1180px;margin:0 auto;padding:18px 26px 22px;display:flex;flex-direction:column;gap:14px;min-height:100vh}

/* ---------------- 顶栏 ---------------- */
.topbar{display:flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,rgba(255,199,44,.07),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:999px;padding:9px 16px;
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand .msvg{width:34px;height:27px;filter:drop-shadow(0 0 10px rgba(255,199,44,.5))}
.brand .ttl{font-size:21px;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(180deg,#FFE79A,#FFC72C 70%,#D99B00);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{border:none;background:transparent;color:var(--dim);cursor:pointer;
  border-radius:999px;padding:8px 17px;font-size:13.5px;font-weight:600;font-family:inherit;
  transition:.18s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:#fff}
.tab.on{background:linear-gradient(180deg,#FFD95E,var(--gold) 65%,var(--gold-d));color:#3A2600;
  font-weight:800;box-shadow:0 4px 16px rgba(255,199,44,.4)}
.tab kbd{font-family:inherit;font-size:9px;font-weight:800;color:inherit;opacity:.45;
  border:1px solid currentColor;border-radius:4px;padding:0 3px;line-height:1.3}
.tab.on kbd{opacity:.55}
.tab.more{color:var(--gold);border:1px dashed rgba(255,199,44,.5);background:rgba(255,199,44,.07)}
.tab.more:hover{background:rgba(255,199,44,.16);border-color:var(--gold)}

.cartbtn{position:relative;flex:none;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--gold);transition:.18s}
.cartbtn:hover{background:rgba(255,199,44,.14);border-color:var(--gold)}
.cartbtn svg{width:19px;height:19px}
.cartbtn .badge{position:absolute;right:-3px;top:-3px;min-width:19px;height:19px;border-radius:999px;
  background:var(--red);color:#fff;font-size:10px;font-weight:800;line-height:19px;text-align:center;
  padding:0 5px;box-shadow:0 2px 8px rgba(218,41,28,.6)}
.orderbtn{flex:none;border:none;cursor:pointer;border-radius:999px;padding:11px 22px;
  background:linear-gradient(180deg,#FFD95E,var(--gold) 65%,var(--gold-d));
  color:#3A2600;font-size:13.5px;font-weight:800;font-family:inherit;
  box-shadow:0 6px 20px rgba(255,199,44,.34);transition:.16s}
.orderbtn:hover{filter:brightness(1.06)}
.orderbtn:active{transform:translateY(1px)}
.orderbtn:disabled{opacity:.4;cursor:not-allowed}

/* ---------------- 弧形舞台 ---------------- */
.hero{position:relative;flex:1;min-height:330px;display:flex;flex-direction:column;justify-content:center}
.arcline{position:absolute;left:0;right:0;top:4%;height:72%;pointer-events:none;z-index:0}
.arcline svg{width:100%;height:100%;overflow:visible}
.cards{display:flex;align-items:flex-end;justify-content:center;gap:6px;position:relative;z-index:2}
.citem{position:relative;cursor:pointer;transition:transform .55s var(--jelly),opacity .4s,filter .4s;
  flex:none;will-change:transform,filter}
.citem .disc{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#2A211B,#171210);
  border:1px solid rgba(255,199,44,.22);
  box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.citem .disc img{width:100%;height:100%;object-fit:cover;display:block}
.citem.dim .disc::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,10,8,.15),rgba(13,10,8,.62))}
.citem .cap{position:absolute;left:50%;transform:translateX(-50%);bottom:-46px;width:230px;
  text-align:center;opacity:0;transition:.35s;pointer-events:none}
.citem.on .cap{opacity:1;bottom:-52px}
.citem .cap .nm{font-size:15px;font-weight:700;line-height:1.3;color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.9);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.citem .cap .pr{font-size:22px;font-weight:800;color:var(--gold);letter-spacing:-.3px;
  text-shadow:0 0 24px rgba(255,199,44,.5)}
.citem.on .disc{border-color:rgba(255,199,44,.85);
  box-shadow:0 0 0 5px rgba(255,199,44,.16),0 0 60px rgba(255,199,44,.34),0 26px 60px rgba(0,0,0,.6)}
.citem:hover .disc{border-color:var(--gold)}

.closed{width:100%;text-align:center;padding:60px 20px;color:var(--dim);font-size:14px;
  font-weight:700;line-height:1.9;position:relative;z-index:2}
.closed small{display:block;font-size:11.5px;color:var(--dim2);font-weight:600;margin-top:4px}

.arrow{position:absolute;top:46%;transform:translateY(-50%);z-index:5;width:44px;height:44px;
  border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--gold);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;
  transition:.16s;backdrop-filter:blur(8px)}
.arrow:hover{background:rgba(255,199,44,.18);border-color:var(--gold);transform:translateY(-50%) scale(1.08)}
.arrow.l{left:2%} .arrow.r{right:2%}

.hint{margin-top:30px;text-align:center;font-size:12px;color:var(--dim2)}
.hint kbd{display:inline-block;padding:1px 6px;border:1px solid rgba(255,255,255,.16);border-radius:5px;
  font-size:11px;font-weight:700;color:var(--dim);font-family:inherit;margin:0 1px}
.hint b{color:var(--gold)}

/* ---------------- 托盘 + 小票 ---------------- */
.bottom{display:grid;grid-template-columns:1fr 322px;gap:18px;align-items:end}
@media(max-width:900px){.bottom{grid-template-columns:1fr}}

.trayzone{position:relative;padding:14px 0 4px}
.tray{position:relative;border-radius:22px;padding:18px 22px;
  background-color:#8C110D;
  background-image:
    linear-gradient(180deg,rgba(10,7,5,.34) 0%,rgba(10,7,5,.52) 55%,rgba(10,7,5,.62) 100%),
    url(/assets/tray.webp);
  background-size:cover;background-position:50% 46%;
  box-shadow:0 26px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.12),
    inset 0 -14px 34px rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;gap:14px;min-height:146px;
  border:1px solid rgba(255,199,44,.14);overflow:hidden}
.tray::before{content:"";position:absolute;left:0;right:0;top:0;height:40%;
  background:linear-gradient(180deg,rgba(255,214,120,.10),rgba(255,214,120,0));
  pointer-events:none}
.tray .empty{color:rgba(255,255,255,.62);font-size:13px;font-weight:600;text-align:center;line-height:1.7}
.tray .food{position:relative;width:96px;height:96px;border-radius:50%;overflow:hidden;cursor:pointer;
  border:2px solid rgba(255,255,255,.22);box-shadow:0 12px 26px rgba(0,0,0,.45);
  transition:transform .2s;flex:none;background:#2A211B}
.tray .food:hover{transform:translateY(-4px) scale(1.03)}
.tray .food img{width:100%;height:100%;object-fit:cover;display:block}
/* 数量: 右下角金色 */
.tray .food .q{position:absolute;right:-3px;bottom:-3px;min-width:22px;height:22px;border-radius:999px;
  background:var(--gold);color:#3A2600;font-size:11px;font-weight:900;line-height:22px;text-align:center;
  padding:0 5px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
/* 删除: 左上角红色, hover 才出现(避免误触) */
.tray .food .del{position:absolute;left:-5px;top:-5px;width:24px;height:24px;border-radius:50%;
  background:var(--red);color:#fff;border:2px solid rgba(255,255,255,.85);
  font-size:14px;font-weight:900;line-height:1;display:none;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.55);z-index:4;padding:0;font-family:inherit}
.tray .food:hover .del{display:flex}
.tray .food .del:hover{background:#8C110D;transform:scale(1.12)}
.trayacts{text-align:center;margin-top:9px;min-height:18px}
.linkbtn{background:none;border:none;color:#FF8A75;font-size:11.5px;font-weight:700;
  cursor:pointer;font-family:inherit;padding:2px 8px;border-radius:8px;transition:.15s}
.linkbtn:hover{background:rgba(218,41,28,.16);text-decoration:underline}

.receipt{position:relative;background:linear-gradient(180deg,#FDFBF4,#F4EFE2);
  color:#241C16;border-radius:10px 10px 4px 4px;padding:15px 17px 11px;
  box-shadow:0 22px 50px rgba(0,0,0,.5);
  font-family:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),96% 100%,92% calc(100% - 9px),88% 100%,
    84% calc(100% - 9px),80% 100%,76% calc(100% - 9px),72% 100%,68% calc(100% - 9px),64% 100%,
    60% calc(100% - 9px),56% 100%,52% calc(100% - 9px),48% 100%,44% calc(100% - 9px),40% 100%,
    36% calc(100% - 9px),32% 100%,28% calc(100% - 9px),24% 100%,20% calc(100% - 9px),16% 100%,
    12% calc(100% - 9px),8% 100%,4% calc(100% - 9px),0 100%)}
.receipt h4{font-size:13px;font-weight:800;text-align:center;letter-spacing:.16em;margin-bottom:9px}
.receipt .rl{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0;
  border-bottom:1px dashed rgba(36,28,22,.16)}
.receipt .rl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.receipt .rl .q{flex:none;font-size:10.5px;font-weight:800;color:#8B7B6C;
  background:rgba(36,28,22,.06);border-radius:4px;padding:0 4px;margin-right:2px}
.receipt .rl .v{font-weight:800;flex:none}
.receipt .rt{display:flex;justify-content:space-between;font-size:13.5px;font-weight:900;
  margin-top:9px;padding-top:7px;border-top:2px solid rgba(36,28,22,.75)}
.receipt .rt .v{color:var(--red)}
.receipt .rsub{text-align:center;font-size:9px;color:#8B7B6C;margin-top:7px;letter-spacing:.06em}
.receipt .rvoid{text-align:center;font-size:11.5px;color:#9A8A7A;padding:10px 0}

/* ---------------- AI 助手 ---------------- */
.ai{background:linear-gradient(170deg,rgba(255,199,44,.075),rgba(255,255,255,.025));
  border:1px solid var(--line);border-radius:22px;padding:16px 19px;
  box-shadow:0 16px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06)}
.ai-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ai-bot{width:44px;height:44px;border-radius:14px;flex:none;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(160deg,rgba(255,199,44,.26),rgba(255,199,44,.08));
  border:1px solid var(--line)}
.ai-bot svg{width:24px;height:24px;stroke:var(--gold)}
.ai-head .t{font-size:14.5px;font-weight:800}
.ai-head .d{font-size:11.5px;color:var(--dim);margin-top:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.045);color:#DCCFC7;border-radius:11px;padding:7px 12px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.16s}
.chip:hover{border-color:var(--gold);color:#fff;background:rgba(255,199,44,.12)}
.chip svg{width:14px;height:14px;stroke:var(--gold);flex:none}
.ai-row{display:flex;gap:9px;align-items:center}
.ai-row input{flex:1;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);
  border-radius:13px;padding:12px 16px;color:#fff;font-size:13.5px;font-family:inherit;outline:none}
.ai-row input::placeholder{color:#6E5F56}
.ai-row input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,199,44,.13)}
.send{flex:none;border:none;cursor:pointer;border-radius:13px;padding:12px 26px;
  background:linear-gradient(180deg,#FFD95E,var(--gold) 65%,var(--gold-d));color:#3A2600;
  font-size:13.5px;font-weight:800;font-family:inherit;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 6px 20px rgba(255,199,44,.32);transition:.16s}
.send:hover{filter:brightness(1.06)}
.send:disabled{opacity:.5;cursor:not-allowed}
.send svg{width:15px;height:15px}
.msg{font-size:11.5px;color:var(--dim);margin-top:9px;min-height:1em;line-height:1.5}
.msg.err{color:#FF8A75}
.msg.ok{color:#6EDFA0}

/* AI 分析条 */
.analysis{display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);
  grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.analysis.on{display:grid}
.a-block{display:flex;align-items:center;gap:10px}
.a-block .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,199,44,.12);border:1px solid var(--line);flex:none}
.a-block .ic svg{width:17px;height:17px;stroke:var(--gold)}
.a-block .lb{font-size:10px;color:var(--dim2);font-weight:700;letter-spacing:.04em}
.a-block .vv{font-size:19px;font-weight:900;line-height:1.1}
.a-block .vv small{font-size:10px;color:var(--dim);font-weight:700;margin-left:2px}
.a-block .adv{font-size:11.5px;color:#D9CCC4;line-height:1.45;max-width:340px}
.avatab{display:none}
.ver{text-align:center;font-size:10px;color:var(--dim2);letter-spacing:.03em;padding:2px 0 4px;
  opacity:.75}

/* ---------------- 顶栏图标按钮 ---------------- */
.icobtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.05);cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--gold);transition:.16s;position:relative}
.icobtn:hover{background:rgba(255,199,44,.14);border-color:var(--gold)}
.icobtn svg{width:19px;height:19px}
.icobtn.rec{background:var(--red);border-color:var(--red);color:#fff;
  animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(218,41,28,.6)}
  50%{box-shadow:0 0 0 10px rgba(218,41,28,0)}}

/* 语音浮层 */
.vlayer{position:fixed;inset:0;background:rgba(6,4,3,.72);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:90}
.vlayer.on{display:flex}
.vbox{background:linear-gradient(170deg,rgba(255,199,44,.14),rgba(30,25,21,.96));
  border:1px solid rgba(255,199,44,.34);border-radius:26px;padding:30px 46px;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.7)}
.wave{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:38px;margin-bottom:14px}
.wave i{width:7px;border-radius:4px;background:var(--gold);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(1){height:12px;animation-delay:0s}
.wave i:nth-child(2){height:26px;animation-delay:.12s}
.wave i:nth-child(3){height:38px;animation-delay:.24s}
.wave i:nth-child(4){height:20px;animation-delay:.36s}
.wave i:nth-child(5){height:30px;animation-delay:.48s}
.wave i:nth-child(6){height:14px;animation-delay:.6s}
@keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.vbox .t1{font-size:18px;font-weight:800;color:#fff}
.vbox .t2{font-size:12.5px;color:var(--dim);margin-top:6px}

/* ---------------- 硬件镜像 ---------------- */
.hwfab{position:fixed;left:22px;bottom:22px;z-index:60;width:58px;height:58px;border-radius:18px;
  border:1px solid rgba(255,199,44,.3);cursor:pointer;
  background:rgba(30,25,21,.9);backdrop-filter:blur(16px);color:var(--gold);
  box-shadow:0 14px 34px rgba(0,0,0,.5);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:.18s}
.hwfab:hover{transform:translateY(-3px);border-color:var(--gold)}
.hwfab svg{width:20px;height:20px}
.hwfab small{font-size:8px;font-weight:800;letter-spacing:.04em;color:#B9ABA2}
.hwpanel{position:fixed;left:22px;bottom:92px;z-index:61;width:288px;display:none;
  background:rgba(24,20,17,.97);backdrop-filter:blur(18px);
  border:1px solid rgba(255,199,44,.26);border-radius:20px;padding:15px;
  box-shadow:0 24px 60px rgba(0,0,0,.65)}
.hwpanel.on{display:block}
.hwpanel h4{margin:0 0 11px;font-size:11px;font-weight:800;color:var(--gold);letter-spacing:.1em;
  display:flex;align-items:center;gap:7px}
.hwpanel h4 span{margin-left:auto;font-size:9px;color:var(--dim2);letter-spacing:.04em}
.hwkeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.hwk{aspect-ratio:1.5;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);color:#B9ABA2;font-size:10px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  cursor:pointer;font-family:inherit;padding:2px;transition:.12s;line-height:1.15;text-align:center}
.hwk:hover{border-color:rgba(255,199,44,.5);color:#fff}
.hwk.hit{background:rgba(255,199,44,.26);border-color:var(--gold);color:#fff;
  box-shadow:0 0 14px rgba(255,199,44,.45);transform:scale(.94)}
.hwk b{font-size:9px;color:var(--gold);opacity:.8}
.hwk i{font-style:normal;font-size:9px;opacity:.62;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hwdir{margin-top:10px;font-size:10.5px;color:var(--dim2);display:flex;justify-content:space-between}
.hwdir b{color:var(--gold)}

/* ---------------- 膳食佐证 ---------------- */
.nutribox{display:none;margin-top:11px;padding-top:11px;border-top:1px solid rgba(255,255,255,.08);
  max-height:230px;overflow-y:auto}
.nutribox.on{display:block}
.nh{font-size:11.5px;font-weight:800;color:var(--gold);margin-bottom:8px;display:flex;
  align-items:center;gap:7px;flex-wrap:wrap}
.nh .tag{font-size:9px;font-weight:700;background:rgba(255,199,44,.16);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;color:var(--gold)}
.ncard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:11px;padding:9px 11px;margin-bottom:7px}
.ncard .nt{font-size:11.5px;font-weight:700;line-height:1.4}
.ncard .nt a{color:#E8D9CC;text-decoration:none}
.ncard .nt a:hover{color:var(--gold);text-decoration:underline}
.ncard .np{font-size:10.5px;color:#9C8C82;line-height:1.5;margin-top:4px}
.ncard .nm2{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:9.5px;color:var(--dim2)}
.ncard .nm2 .sc{color:var(--gold)}
.nempty{font-size:11px;color:var(--dim);line-height:1.6;padding:4px 0}

<script>
const $=id=>document.getElementById(id);
const fmt=n=>(typeof n==='number'?n:0).toFixed(2);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let CATALOG=[], STATE={cart:[]}, CAT='__all__', BASE=0, ENGINE='local', BUSY=false;
let CATS=[];                  // 真实分类(来自麦当劳 MCP): [key,label,count]
const ALL='__all__';
const PER=7;                  // 归并后共 7 类, 1-7 键正好全覆盖; 若类别超过 7 个, 7 号键转为「换一组」
let PAGE=0;
const VIS=5;                  // 可见卡片数(奇)
const HALF=(VIS-1)/2;

function post(path,body){
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})}).then(r=>r.json()).catch(e=>({error:String(e)}));
}
/* ---------------- 归并分类 ----------------
   MCP 真实 cat 有 15 个, 太碎。这里按麦当劳真实分类名映射成 7 个语义大类,
   再用餐品名称做微调(甜品/咖啡/冰品), 保证 122 款都能归到某一类。 */
const GROUPS=['全部','主食','炸鸡','小食','甜品','饮品','套餐'];
const CATMAP={
  '巨无霸牛鱼肉堡':'主食','鸡肉汉堡/卷':'主食','安格斯MAX厚牛堡':'主食',
  '炸鸡':'炸鸡','蘸酱炸鸡':'炸鸡',
  '小食甜品/其他':'小食','小食拼盘/多人餐':'小食',
  '饮品':'饮品','麦咖啡™':'饮品',
  '人气热卖':'套餐','精选单人餐':'套餐','500大卡套餐':'套餐',
  '随心配1+1':'套餐','大堡口福单人餐':'套餐','开心乐园':'套餐'
};
function groupOf(c){
  const cat=c.cat||'', n=c.name||'';
  // 名称优先: 甜品/咖啡/套餐等藏在混合分类里, 按名称拆。顺序敏感, 实测校准过:
  if(/丝巾|公仔|玩具|周边|徽章/.test(n)) return '小食';   // 随餐周边, 归入小食(其他)
  if(/派$|冰淇淋|圣代|麦旋风|甜筒|新地|雪糕|蛋糕|布丁|蛋挞|甜品/.test(n)) return '甜品';
  if(/咖啡|拿铁|美式|卡布|摩卡|澳白|可可/.test(n)) return '饮品';
  // 套餐排在主食前: 套餐名常带"堡/巨无霸"等主食词, 否则会被误归主食
  if(/套餐|单人餐|多人餐|乐园|随心配|1\+1|大卡/.test(n)) return '套餐';
  if(/薯|玉米|沙拉|洋葱圈|拼盘|分享盒|小食/.test(n)) return '小食';
  // 主食排在炸鸡前: "麦辣鸡腿堡"是汉堡不是炸鸡
  if(/汉堡|堡|卷|麦香|吉士|牛柳/.test(n)) return '主食';
  if(/炸鸡|鸡翅|鸡块|鸡米花|辣翅|鸡排/.test(n)) return '炸鸡';
  if(/可乐|雪碧|果汁|牛奶|豆浆|茶|矿泉水|气泡水|纯净水/.test(n)) return '饮品';
  return CATMAP[cat]||'小食';
}
function buildCats(){
  const m=new Map();
  CATALOG.forEach(c=>{ const g=groupOf(c); m.set(g,(m.get(g)||0)+1); });
  CATS=[[ALL,'全部',CATALOG.length]];
  GROUPS.slice(1).forEach(g=>{ if(m.get(g)) CATS.push([g,g,m.get(g)]); });
}
function list(){ return CAT===ALL?CATALOG:CATALOG.filter(c=>groupOf(c)===CAT); }
function imgOf(c){ return (c&&(c.localImg||c.image))||''; }
function setImg(el,c){
  const local=c.localImg, remote=c.image;
  el.onerror=()=>{ if(remote&&el.src!==remote&&local) el.src=remote; else el.style.opacity=0; };
  el.src=local||remote||'';
}

/* ---------------- 顶部分类 ---------------- */
/* 每页 6 个真实分类, 7 号键换下一组(8 号键留给确认订单) */
function pageTabs(){
  const start=PAGE*PER;
  return {slice:CATS.slice(start,start+PER), hasMore:CATS.length>start+PER};
}
function renderTabs(){
  const {slice,hasMore}=pageTabs();
  let html=slice.map(([k,label],i)=>
    `<button class="tab ${CAT===k?'on':''}" data-c="${esc(k)}"><kbd>${i+1}</kbd>${esc(label)}</button>`
  ).join('');
  if(hasMore) html+=`<button class="tab more" data-more="1"><kbd>7</kbd>换一组 ›</button>`;
  $('tabs').innerHTML=html;
  $('tabs').querySelectorAll('.tab').forEach(b=>{
    b.onclick=()=>{ if(b.dataset.more) nextPage(); else setCat(b.dataset.c); };
  });
}
function setCat(k){
  CAT=k; BASE=0; renderTabs();
  const L=list();
  if(L.length){
    STATE.selected=L[0].name;
    renderCards();
    post('/api/select',{index:CATALOG.indexOf(L[0])});
  }else renderCards();
}
function nextPage(){
  const pages=Math.max(1,Math.ceil(CATS.length/PER));
  PAGE=(PAGE+1)%pages;
  renderTabs();
}

/* ---------------- 弧形卡片 ---------------- */
function renderCards(){
  const L=list(), box=$('cards');
  if(!L.length){
    if(!CATALOG.length){
      const st=(STATE&&STATE.store)||{};
      const tm=(st.businessStartTime&&st.businessEndTime)?`${st.businessStartTime}-${st.businessEndTime}`:'';
      box.innerHTML='<div class="closed">门店当前非营业 '+(tm?'('+esc(tm)+') ':'')+
        '<small>麦当劳 MCP 暂无在售菜单，营业时间内再来即可</small></div>';
    }else{
      box.innerHTML='<div class="closed">该分类暂无在售餐品<small>换一个分类看看</small></div>';
    }
    return;
  }
  const idx=L.findIndex(c=>c.name===STATE.selected);
  if(idx>=0) BASE=idx;
  if(BASE>=L.length) BASE=0;

  if(box.children.length!==VIS){
    box.innerHTML='';
    for(let i=0;i<VIS;i++){
      const d=document.createElement('div');
      d.className='citem';
      d.innerHTML='<div class="disc"><img alt=""></div>'+
                  '<div class="cap"><div class="nm"></div><div class="pr"></div></div>';
      box.appendChild(d);
    }
  }
  // 尺寸: 以中心为基准
  const w=box.getBoundingClientRect().width||1100;
  const mid=Math.min(300, Math.max(200, w*0.26));
  const sizes={0:mid,1:mid*0.64,2:mid*0.46};
  const lift={0:-46,1:-6,2:34};
  const opa={0:1,1:.72,2:.40};
  const blur={0:0,1:1.2,2:2.6};

  [...box.children].forEach((el,k)=>{
    const off=k-HALF, a=Math.abs(off);
    const item=L[((BASE+off)%L.length+L.length)%L.length];
    const sz=sizes[a], isMid=a===0;

    el.style.width=sz+'px';
    el.style.transform=`translateY(${lift[a]}px)`;
    el.style.opacity=opa[a];
    el.style.filter=blur[a]?`blur(${blur[a]}px)`:'none';
    el.style.zIndex=10-a;
    el.classList.toggle('on',isMid);
    el.classList.toggle('dim',!isMid);

    if(el.dataset.code!==item.code){
      el.dataset.code=item.code;
      const img=el.querySelector('img'); img.style.opacity=1;
      setImg(img,item);
      el.querySelector('.nm').textContent=item.name;
      el.querySelector('.pr').textContent='¥'+fmt(item.price);
    }
    el.onclick=()=>addItem(item);
  });
}

/* ---------------- 加购 ---------------- */
function say(t){ $('msg').className='msg'; $('msg').textContent=t; }
function addItem(item){
  post('/api/select',{index:CATALOG.indexOf(item)});
  post('/api/add',{code:item.code}).then(()=>{ poll(); say('已加入 '+item.name); });
}
function removeItem(code){ post('/api/remove',{code,qty:1}).then(poll); }

/* ---------------- 托盘 / 小票 ---------------- */
function renderTray(){
  const cart=STATE.cart||[];
  const tray=$('tray');
  if(!cart.length){
    tray.innerHTML='<div class="empty">托盘空着<br>转旋钮或点上面的套餐加入</div>';
  }else{
    tray.innerHTML=cart.map(i=>{
      const c=CATALOG.find(x=>x.code===i.code)||{};
      return `<div class="food" data-code="${esc(i.code)}" title="${esc(i.name)}">
        <img src="${esc(imgOf(c))}" alt="" onerror="this.style.opacity=0">
        <button class="del" data-code="${esc(i.code)}" title="减少一份">×</button>
        <span class="q">${i.qty}</span></div>`;
    }).join('');
    // 只有 × 能删, 点图片不再误删
    tray.querySelectorAll('.del').forEach(b=>{
      b.onclick=e=>{ e.stopPropagation(); removeItem(b.dataset.code); };
    });
  }
  $('trayActs').style.display=cart.length?'block':'none';

  const rc=$('receipt');
  const p=STATE.price||{};
  if(!cart.length){
    rc.innerHTML='<h4>订 单 明 细</h4><div class="rvoid">还没有选餐</div>';
  }else{
    rc.innerHTML='<h4>订 单 明 细</h4>'+
      cart.map(i=>`<div class="rl"><span class="n">${esc(i.name)}</span>`+
        `<span class="q">×${i.qty}</span>`+
        `<span class="v">¥${fmt(i.subtotal)}</span></div>`).join('')+
      `<div class="rt"><span>合计</span><span class="v">¥${fmt(p.payable)}</span></div>`+
      (p.discount>0?`<div class="rsub">已优惠 ¥${fmt(p.discount)}</div>`:'')+
      `<div class="rsub">价格来自麦当劳 MCP 实时核价</div>`;
  }

  const n=cart.reduce((s,i)=>s+i.qty,0);
  $('cartBadge').textContent=n;
  $('cartBadge').style.display=n?'block':'none';
  $('btnConfirm').disabled=!n;
  renderAnalysis(cart);
}

/* ---------------- 热量估算(粗算, 非官方) ---------------- */
const KCAL={main:560,side:280,drink:165,other:230};
function renderAnalysis(cart){
  const box=$('analysis');
  if(!cart.length){ box.classList.remove('on'); return; }
  box.classList.add('on');
  let kcal=0, main=0, side=0, drink=0;
  cart.forEach(i=>{
    const k=KCAL[i.role]||200;
    kcal+=k*i.qty;
    if(i.role==='main') main+=i.qty;
    if(i.role==='side') side+=i.qty;
    if(i.role==='drink') drink+=i.qty;
  });
  $('kcal').innerHTML=Math.round(kcal)+'<small>kcal</small>';
  const tips=[];
  if(main&&!side) tips.push('只有主食，加一份小食（沙拉/玉米）更均衡');
  if(main&&!drink) tips.push('没有饮品，建议配无糖可乐或纯牛奶');
  if(side) tips.push('小食已搭配，注意油炸类控制份量');
  if(drink>=2) tips.push('饮品偏多，建议换一杯为水');
  if(!tips.length) tips.push('搭配比较均衡，注意总热量即可');
  $('advice').textContent=tips.join('；')+'。';
}

/* ---------------- 轮询 ---------------- */
async function poll(){
  try{
    const r=await fetch('/api/state'); STATE=await r.json();
    renderCards(); renderTray();
  }catch(e){}
}

/* ---------------- 旋转 ---------------- */
function rotate(d){
  const L=list(); if(!L.length) return;
  BASE=((BASE+d)%L.length+L.length)%L.length;
  const item=L[BASE];
  STATE.selected=item.name;
  renderCards();
  post('/api/select',{index:CATALOG.indexOf(item)});
}

/* ---------------- 键盘 ---------------- */
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(/^[1-8]$/.test(e.key)){          // 1-6 切分类 / 7 换一组 / 8 确认订单
    const n=parseInt(e.key,10);
    if(n===8){ e.preventDefault(); confirmOrder(); return; }
    const {slice,hasMore}=pageTabs();
    if(n<=slice.length){ e.preventDefault(); setCat(slice[n-1][0]); }
    else if(n===7&&CATS.length>PER){ e.preventDefault(); nextPage(); }  // 末页按 7 回到第一页
    return;
  }
  if(e.key==='ArrowLeft'){ e.preventDefault(); rotate(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); rotate(1); }
  else if(e.key==='Enter'){
    const L=list(), cur=L[BASE];
    if(cur){ e.preventDefault(); addItem(cur); }
  }
});

/* ---------------- AI 助手 ---------------- */
function parseAsk(text){
  const t=String(text||'');
  const people=(t.match(/(\d+)\s*(?:人|位)/)||[])[1];
  const budget=(t.match(/预算\s*(\d+)/)||t.match(/(\d+)\s*元/)||[])[1];
  const avoid=[];
  const re=/不要\s*([^\s,，。;；]+)/g; let m;
  while((m=re.exec(t))){ if(m[1]&&avoid.indexOf(m[1])<0) avoid.push(m[1]); }
  const spicy=/辣/.test(t);
  return {people:people?+people:2, budget:budget?+budget:60, avoid, spicy};
}
async function ask(){
  if(BUSY) return;
  const text=$('ask').value.trim();
  if(!text){ $('msg').className='msg err'; $('msg').textContent='先说一句你的需求，比如「2 人 预算 60 元」'; return; }
  const q=parseAsk(text);
  BUSY=true; $('btnSend').disabled=true;
  $('msg').className='msg'; $('msg').textContent='AI 正在配单…';
  const r=await post('/api/plan',{
    people:q.people, budget:q.budget, avoid:q.avoid.join(','), engine:ENGINE
  });
  BUSY=false; $('btnSend').disabled=false;
  if(r&&r.error){
    $('msg').className='msg err';
    $('msg').textContent='配单失败：'+r.error+(r.note?('（'+r.note+'）'):'');
  }else{
    $('msg').className='msg ok';
    $('msg').textContent=`已按 ${q.people} 人 / 预算 ${q.budget} 元配好 · 应付 ¥${fmt(r.payable)}`+
      (r.discount>0?` · 省 ¥${fmt(r.discount)}`:'')+
      (r.balance>0?` · 再加 ¥${fmt(r.balance)} 解锁 ${r.next}`:'')+
      (r.engine==='llm'?` · ${r.model}`:'');
  }
  poll();
}

/* ---------------- 绑定 ---------------- */
$('btnSend').onclick=ask;
$('ask').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); ask(); } });
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  $('ask').value=c.dataset.fill||'';
  $('ask').focus();
});
$('cartBtn').onclick=()=>{ window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); };
function confirmOrder(){
  if(!(STATE.cart||[]).length) return;
  post('/api/key',{key:8}).then(r=>{
    const p=(r&&r.price)||STATE.price||{};
    $('msg').className='msg ok';
    $('msg').textContent=`订单已确认 · 应付 ¥${fmt(p.payable)}`+(p.discount>0?` · 省 ¥${fmt(p.discount)}`:'');
    poll();
  });
}
$('btnConfirm').onclick=confirmOrder;
$('btnClear').onclick=()=>{
  post('/api/clear').then(()=>{ poll(); say('餐盘已清空'); });
};

/* ---------------- 语音 PTT ---------------- */
let voiceBusy=false;
function voiceDown(){
  if(voiceBusy) return; voiceBusy=true;
  $('vlayer').classList.add('on');
  $('micBtn').classList.add('rec');
  $('vtitle').textContent='我在听…';
  $('vsub').textContent='说完松手即发送';
  post('/api/voice',{state:'down'});
}
function voiceUp(){
  if(!voiceBusy) return; voiceBusy=false;
  $('vlayer').classList.remove('on');
  $('micBtn').classList.remove('rec');
  post('/api/voice',{state:'up'});
}
(function bindMic(){
  const m=$('micBtn');
  m.addEventListener('pointerdown',e=>{ e.preventDefault(); voiceDown(); });
  m.addEventListener('pointerup',()=>voiceUp());
  m.addEventListener('pointerleave',()=>voiceUp());
  m.addEventListener('click',e=>e.preventDefault());
})();

/* ---------------- 硬件镜像 (8 键) ---------------- */
let KEYMAP={};
const ACTIONS={confirm:'确认下单',clear:'清空餐盘',voice:'语音',up:'上一个',down:'下一个'};
async function loadKeymap(){
  try{
    const c=await (await fetch('/api/config')).json();
    KEYMAP=c.keymap||{};
    renderHwKeys();
  }catch(e){ renderHwKeys(); }
}
function renderHwKeys(){
  const box=$('hwkeys');
  let html='';
  for(let n=1;n<=8;n++){
    const cfg=KEYMAP[String(n)];
    let sub='';
    if(n===8) sub='确认下单';
    else if(cfg&&cfg.type==='item'){
      const it=CATALOG.find(c=>c.code===cfg.code);
      sub=it?it.name.slice(0,5):'餐品';
    }else if(cfg&&cfg.type==='action'){
      sub=ACTIONS[cfg.action]||cfg.action;
    }else{
      const mains=CATALOG.filter(c=>c.role==='main');
      const it=mains[n-1];
      sub=it?it.name.slice(0,5):'餐品';
    }
    html+=`<button class="hwk" data-k="${n}"><b>${n}</b><i>${esc(sub)}</i></button>`;
  }
  box.innerHTML=html;
  box.querySelectorAll('.hwk').forEach(b=>b.onclick=()=>pressKey(+b.dataset.k));
}
function pressKey(n){
  const el=document.querySelector(`.hwk[data-k="${n}"]`);
  if(el){ el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),260); }
  $('hwdirTxt').textContent='按键 '+n;
  post('/api/key',{key:n}).then(r=>{
    if(r&&r.say) say(r.say);
    poll();
  });
}
$('hwFab').onclick=()=>{
  const p=$('hwPanel');
  p.classList.toggle('on');
  if(p.classList.contains('on')&&!Object.keys(KEYMAP).length) loadKeymap();
};

/* ---------------- 官方膳食佐证 ---------------- */
$('btnNutri').onclick=async()=>{
  const box=$('nutriBox'), cart=STATE.cart||[];
  box.classList.add('on');

    box.innerHTML='<div class="nempty">餐盘还是空的，先加几样餐品再查<b>官方膳食参考</b>。</div>';
    return;

  const names=[...new Set(cart.map(i=>i.name))].slice(0,4).join(' ');
  const kw=names+' 热量 营养 膳食 建议';
  box.innerHTML='<div class="nload">正在向元宝搜索官方信源求证「'+esc(names)+'」的营养与膳食建议…</div>';
  const d=await post('/api/yb',{keywords:kw,round:1,industry:'gov',cnt:10});
  if(d.error||!d.count){
    box.innerHTML='<div class="nempty">官方信源暂时没查到可靠结果'+
      (d.error?('（'+esc(d.error)+'）'):'')+'，已如实告知，不编造。</div>';
    return;
  }
  let html='<div class="nh">官方膳食佐证 <span class="tag">元宝 · Industry=gov</span></div>';
  html+=(d.pages||[]).slice(0,4).map(p=>{
    const ok=/^https?:\/\//.test(p.url);
    return '<div class="ncard"><div class="nt">'+
      (ok?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title||p.url)}</a>`
         :esc(p.title||'(无标题)'))+'</div>'+
      (p.passage?`<div class="np">${esc(p.passage.slice(0,150))}${p.passage.length>150?'…':''}</div>`:'')+
      '<div class="nm2">'+(p.site?`<span>来源 ${esc(p.site)}</span>`:'')+
      (p.date?`<span>${esc(p.date)}</span>`:'')+
      '</div></div>';
  }).join('');
  html+='<div class="nempty" style="margin-top:2px">来自元宝搜索官方信源(Industry=gov)，仅供搭配参考，具体以包装营养标签与官方渠道为准。</div>';
  box.innerHTML=html;
};
$('arrowL').onclick=()=>rotate(-1);
$('arrowR').onclick=()=>rotate(1);

(async function init(){
  try{
    const d=await (await fetch('/api/menu')).json();
    CATALOG=d.catalog||[];
    buildCats();                 // 分类取自 MCP 真实 cat 字段
    await poll();

  }catch(e){
    $('msg').className='msg err'; $('msg').textContent='未连接到点餐服务';
  }
})();
window.addEventListener('resize',()=>renderCards());
setInterval(poll,1200);
