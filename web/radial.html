<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 96'%3E%3Cg stroke='%23FFC72C' stroke-width='15' fill='none'%3E%3Cpath d='M12 88 C12 30 26 6 42 6 C58 6 68 30 68 88'/%3E%3Cpath d='M52 88 C52 30 66 6 82 6 C98 6 108 30 108 88'/%3E%3C/g%3E%3C/svg%3E">
<title>麦门点餐台 · 环形旋钮版</title>
<style>
:root{
  --red:#DA291C; --red-d:#B81E12;
  --gold:#FFC72C; --gold-d:#E8A800; --gold-s:#FFF6E0;
  --bg:#F5F5F7; --card:#FFFFFF;
  --ink:#1D1D1F; --dim:#86868B;
  --line:#E5E5EA; --line-2:#F0F0F3;
  --ok:#1E9E5A;
  --jelly:cubic-bezier(.34,1.42,.48,1);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 30px rgba(0,0,0,.06);
  --shadow-s:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.05);
  --blur:saturate(180%) blur(20px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,#F5F5F7 46%,#EEEEF1 100%);
  color:var(--ink);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:16px 22px 22px}

/* ---------------- 顶栏 ---------------- */
.top{display:flex;align-items:center;gap:18px;
  background:rgba(255,255,255,.74);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--line);border-radius:18px;padding:11px 18px;box-shadow:var(--shadow-s)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:38px;height:31px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08))}
.brand .t{font-size:18px;font-weight:700;letter-spacing:.2px}
.brand .t em{font-style:normal;color:var(--red)}
.brand .sub{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim);margin-top:1px}

.tabs{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;color:var(--dim);cursor:pointer;
  border-radius:999px;padding:6px 15px;font-size:13px;font-weight:600;font-family:inherit;
  transition:.16s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px}
.tab kbd{font-family:inherit;font-size:9px;font-weight:800;color:var(--dim);
  background:#F0F0F3;border-radius:4px;padding:2px 5px;line-height:1;flex:none}
.tab.on kbd{background:rgba(255,255,255,.3);color:#fff}
.tab .cnt{font-size:10px;opacity:.55;font-weight:600}
.tab:hover{border-color:var(--gold);color:var(--ink)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff;
  box-shadow:0 4px 12px rgba(218,41,28,.26)}

.stat{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--dim);flex:none}
.stat .dot{width:8px;height:8px;border-radius:50%;background:#C7C7CC;transition:.2s}
.stat.on{color:var(--ink)}
.stat.on .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(30,158,90,.16)}

/* ---------------- 主布局 ---------------- */
.main{display:grid;grid-template-columns:1fr 372px;gap:20px;margin-top:16px;align-items:start}
@media(max-width:1080px){.main{grid-template-columns:1fr}}

/* ---------------- 环形舞台 ---------------- */
.stage-wrap{display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:min(680px,66vh);aspect-ratio:1;margin:4px auto 0;
  touch-action:none;user-select:none}
/* 轨道装饰 */
.ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);
  pointer-events:none}
.ring.r1{width:78%;height:78%;border:1px dashed rgba(218,41,28,.10)}
.ring.r2{width:96%;height:96%;border:1px solid rgba(255,199,44,.22)}
.ring.r3{width:56%;height:56%;border:1px solid rgba(255,199,44,.16)}

/* 中心圆盘 */
.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:35.5%;height:35.5%;border-radius:50%;
  background:linear-gradient(165deg,#FFFFFF 0%,#FFFDF6 100%);
  box-shadow:0 0 0 1px rgba(255,199,44,.35),0 0 0 10px rgba(255,255,255,.6),
    0 18px 44px rgba(0,0,0,.13),inset 0 1px 0 #fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-align:center;padding:10px;z-index:50;transition:transform .3s var(--jelly),box-shadow .3s}
.core.bump{transform:translate(-50%,-50%) scale(1.045)}
.core .m{width:56%;height:auto;filter:drop-shadow(0 4px 10px rgba(232,168,0,.35));
  animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.core .cn{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25;margin-top:6px;
  max-width:92%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.core .cp{font-size:19px;font-weight:800;color:var(--red);letter-spacing:-.3px}
.core .cp small{font-size:10px;font-weight:600;color:var(--dim);margin-left:3px}

/* 环形餐品卡 */
.orbs{position:absolute;inset:0}
.orb{position:absolute;width:15.6%;aspect-ratio:1;border-radius:50%;
  background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow-s);cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  padding:7% 4% 4%;
  transition:left .52s var(--jelly),top .52s var(--jelly),transform .52s var(--jelly),
    opacity .34s ease,box-shadow .22s,border-color .22s;
  will-change:left,top,transform,opacity}
.orb .thumb{width:52%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--line-2);
  border:1px solid rgba(0,0,0,.04);flex:none}
.orb .nm{font-size:8.6px;font-weight:600;color:var(--ink);line-height:1.2;text-align:center;
  width:100%;height:2.4em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;word-break:break-all}
.orb .pr{font-size:10.5px;font-weight:800;color:var(--red);line-height:1}
.orb:hover{border-color:var(--gold);box-shadow:0 8px 22px rgba(255,199,44,.28)}
.orb.sel{border-color:var(--gold);border-width:2px;
  background:linear-gradient(170deg,#FFFDF6,var(--gold-s));
  box-shadow:0 0 0 6px rgba(255,199,44,.18),0 12px 30px rgba(232,168,0,.30);
  animation:selpulse 2.2s ease-in-out infinite}
@keyframes selpulse{0%,100%{box-shadow:0 0 0 6px rgba(255,199,44,.16),0 12px 30px rgba(232,168,0,.26)}
  50%{box-shadow:0 0 0 11px rgba(255,199,44,.08),0 14px 34px rgba(232,168,0,.34)}}
.orb.sel .nm{font-size:9.6px}
.orb.sel .pr{font-size:13px}
.orb .add{position:absolute;right:6%;bottom:6%;width:22%;aspect-ratio:1;border-radius:50%;
  background:var(--red);color:#fff;border:none;font-size:11px;font-weight:800;line-height:1;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 8px rgba(218,41,28,.4)}
.orb.sel .add{display:flex}

.hint{margin-top:14px;font-size:12px;color:var(--dim);text-align:center}
.hint b{color:var(--red);font-weight:700}
.hint kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:5px;background:#fff;font-size:11px;font-weight:700;color:var(--ink);font-family:inherit}

/* ---------------- 右侧栏 ---------------- */
.side{display:flex;flex-direction:column;gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;
  box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:11px}
.ch::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--gold)}
.ch span{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--dim)}

/* 餐盘圆点 */
.tray{display:flex;flex-wrap:wrap;gap:9px;min-height:62px;align-items:center}
.tray .empty{font-size:12px;color:var(--dim);line-height:1.6}
.titem{position:relative;width:52px;height:52px;border-radius:50%;cursor:pointer;
  border:1px solid var(--line);background:#fff;transition:.16s}
.titem img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.titem:hover{border-color:var(--red);transform:scale(1.06)}
.titem .q{position:absolute;right:-3px;top:-3px;min-width:19px;height:19px;border-radius:999px;
  background:var(--red);color:#fff;font-size:10px;font-weight:800;line-height:19px;text-align:center;
  padding:0 4px;box-shadow:0 2px 5px rgba(218,41,28,.4)}

/* 订单明细 */
.lines{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.line{display:flex;align-items:baseline;gap:6px;font-size:12.5px}
.line .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.line .x{font-size:11px;font-weight:700;color:var(--dim);flex:none}
.line .v{font-weight:700;color:var(--ink);flex:none;font-variant-numeric:tabular-nums}
.line.void{color:var(--dim)}
.lines .empty{font-size:12px;color:var(--dim);padding:6px 0}

.totals{border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:5px}
.t-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--dim)}
.t-row b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.t-row.pay{font-size:13px;color:var(--ink)}
.t-row.pay b{font-size:25px;font-weight:800;color:var(--red);letter-spacing:-.6px}
.t-row.pay b::before{content:"¥";font-size:14px;margin-right:1px;vertical-align:2px}
.save{font-size:11px;color:var(--ok);font-weight:700}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;
  padding:10px 14px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  transition:.15s;width:100%}
.btn:hover{border-color:var(--dim)}
.btn.wide{margin-top:9px}
.btn.gold{background:linear-gradient(180deg,#FFD95E,var(--gold) 62%,var(--gold-d));border:none;
  color:#5A3B00;box-shadow:0 5px 15px rgba(255,199,44,.36)}
.btn.gold:hover{filter:brightness(1.04)}
.btn.gold:active{transform:translateY(1px)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;
  box-shadow:0 5px 15px rgba(218,41,28,.28)}
.btn.red:hover{background:var(--red-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* AI 配单 */
.ai-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.ai-row label{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;color:var(--dim)}
.ai-row input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;font-weight:700;font-family:inherit;color:var(--ink);background:#fff;
  font-variant-numeric:tabular-nums}
.ai-row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,199,44,.15)}
.seg{display:inline-flex;background:#F0F0F3;border-radius:10px;padding:3px;gap:3px;margin-bottom:9px;width:100%}
.seg button{flex:1;border:none;background:transparent;padding:6px 10px;border-radius:7px;font-size:12px;
  font-weight:700;color:var(--dim);cursor:pointer;font-family:inherit;transition:.14s}
.seg button.on{background:#fff;color:var(--red);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.msg{margin-top:9px;font-size:11.5px;line-height:1.5;color:var(--dim);min-height:1em;word-break:break-all}
.msg.err{color:var(--red)}
.msg.ok{color:var(--ok)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 120 96" fill="none"><g stroke="#FFC72C" stroke-width="15">
      <path d="M12 88 C12 30 26 6 42 6 C58 6 68 30 68 88"/>
      <path d="M52 88 C52 30 66 6 82 6 C98 6 108 30 108 88"/></g></svg>
    <div><div class="t">麦门<em>点餐台</em></div><div class="sub">RADIAL DIAL</div></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="stat" id="stat"><i class="dot"></i><span id="statTxt">连接中</span></div>
</header>

<main class="main">
  <section class="stage-wrap">
    <div class="stage" id="stage">
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="ring r3"></div>
      <div class="orbs" id="orbs"></div>
      <div class="core" id="core">
        <svg class="m" viewBox="0 0 120 96" fill="none"><g stroke="#FFC72C" stroke-width="15">
          <path d="M12 88 C12 30 26 6 42 6 C58 6 68 30 68 88"/>
          <path d="M52 88 C52 30 66 6 82 6 C98 6 108 30 108 88"/></g></svg>
        <div class="cn" id="coreName">—</div>
        <div class="cp" id="corePrice">--</div>
      </div>
    </div>
    <div class="hint"><kbd>1</kbd>-<kbd>5</kbd> 切分类 · <kbd>←</kbd> <kbd>→</kbd> 旋转选餐 · <kbd>Enter</kbd> 加入餐盘 · <b>点圆卡直接加购</b></div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="ch">餐盘 <span>TRAY</span></div>
      <div class="tray" id="tray"><div class="empty">餐盘是空的<br>点圆卡或按 Enter 加入</div></div>
    </div>

    <div class="card">
      <div class="ch">订单 <span>ORDER</span></div>
      <div class="lines" id="lines"><div class="empty">还没有选餐</div></div>
      <div class="totals">
        <div class="t-row"><span>原价合计</span><b id="orig">¥0.00</b></div>
        <div class="t-row"><span>本单已省 <span class="save" id="saveTag"></span></span><b id="disc">¥0.00</b></div>
        <div class="t-row pay"><span>应付金额</span><b id="pay">0.00</b></div>
      </div>
      <button class="btn gold wide" id="btnConfirm">确认这一单</button>
      <button class="btn wide" id="btnClear">清空餐盘</button>
    </div>

    <div class="card">
      <div class="ch">AI 配单 <span>AI PLAN</span></div>
      <div class="ai-row">
        <label>人数<input id="people" type="number" value="2" min="1" max="10"></label>
        <label>预算（元）<input id="budget" type="number" value="60" min="10" step="5"></label>
      </div>
      <div class="seg" id="engSeg">
        <button data-e="local" class="on">本地算法</button>
        <button data-e="llm">大模型</button>
      </div>
      <button class="btn red" id="btnPlan">一键配单</button>
      <div class="msg" id="msg"></div>
    </div>
  </aside>
</main>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>(typeof n==='number'?n:0).toFixed(2);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let CATALOG=[], STATE={cart:[]}, ROLE='all', ENGINE='local', BASE=0;
const ROLES=[['all','全部'],['main','主食'],['side','小食'],['drink','饮品'],['other','甜品']];
const N=13;                 // 环形槽位数(奇数, 中间为选中)
const HALF=(N-1)/2;

function post(path,body){
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})}).then(r=>r.json()).catch(e=>({error:String(e)}));
}
function list(){ return ROLE==='all'?CATALOG:CATALOG.filter(c=>c.role===ROLE); }

/* ---------- 顶部分类 ---------- */
function renderTabs(){
  $('tabs').innerHTML=ROLES.map(([k,label],i)=>{
    const cnt=k==='all'?CATALOG.length:CATALOG.filter(c=>c.role===k).length;
    return `<button class="tab ${ROLE===k?'on':''}" data-r="${k}">`+
      `<kbd>${i+1}</kbd>${label}<span class="cnt">${cnt}</span></button>`;
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>setRole(b.dataset.r));
}

/* 切分类: 数字键 1-5 与点击共用。切换后把中心项同步为新分类首项 */
function setRole(k){
  ROLE=k; BASE=0;
  renderTabs();
  const L=list();
  if(L.length){
    STATE.selected=L[0].name;                 // 先本地同步, 避免被旧 selected 拉回
    renderOrbs();
    post('/api/select',{index:CATALOG.indexOf(L[0])});
  }else{
    renderOrbs();
  }
}

/* ---------- 环形渲染 ---------- */
function renderOrbs(){
  const L=list(); const box=$('orbs');
  if(!L.length){ box.innerHTML=''; return; }
  // 基准: 当前服务端选中项在当前分类中的位置
  const selName=STATE.selected;
  const idx=L.findIndex(c=>c.name===selName);
  if(idx>=0) BASE=idx;
  if(BASE>=L.length) BASE=0;

  if(box.children.length!==N){
    box.innerHTML='';
    for(let i=0;i<N;i++){
      const d=document.createElement('div');
      d.className='orb';
      d.innerHTML='<img class="thumb" alt=""><div class="nm"></div><div class="pr"></div>'+
                  '<button class="add" title="加入餐盘">+</button>';
      box.appendChild(d);
    }
  }
  const rect=$('stage').getBoundingClientRect();
  const cx=rect.width/2, cy=rect.height/2;
  const R=Math.min(rect.width,rect.height)*0.402;

  [...box.children].forEach((el,k)=>{
    const off=k-HALF;
    const item=L[((BASE+off)%L.length+L.length)%L.length];
    const th=off*(2*Math.PI/N);              // 0 = 3点钟方向
    const x=cx+R*Math.cos(th), y=cy+R*Math.sin(th);
    const a=Math.abs(off);
    const scale=a===0?1.30:a===1?1.0:a===2?0.88:a===3?0.78:0.70;
    const op=a===0?1:a===1?.97:a===2?.84:a===3?.58:0.34;

    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.transform=`translate(-50%,-50%) scale(${scale})`;
    el.style.opacity=op;
    el.style.zIndex=100-a;
    el.classList.toggle('sel',a===0);

    if(el.dataset.code!==item.code){
      el.dataset.code=item.code;
      const img=el.querySelector('.thumb');
      img.style.display='';
      const local=item.localImg, remote=item.image;
      const tryLoad=src=>{
        if(!src){ img.style.display='none'; return; }
        img.onerror=()=>{ if(src===local&&remote) tryLoad(remote); else img.style.display='none'; };
        img.src=src;
      };
      tryLoad(local||remote);
      el.querySelector('.nm').textContent=item.name;
      el.querySelector('.pr').textContent='¥'+fmt(item.price);
    }
    el.onclick=e=>{
      if(e.target.classList.contains('add')) e.stopPropagation();
      addItem(item);
    };
  });

  // 中心: 当前选中
  const cur=L[BASE];
  if(cur){
    $('coreName').textContent=cur.name;
    $('corePrice').innerHTML='¥'+fmt(cur.price);
    if($('core').dataset.code!==cur.code){
      $('core').dataset.code=cur.code;
      $('core').classList.add('bump');
      setTimeout(()=>$('core').classList.remove('bump'),320);
    }
  }
}

/* ---------- 加购 / 删除 ---------- */
function addItem(item){
  post('/api/select',{index:CATALOG.indexOf(item)});
  post('/api/add',{code:item.code}).then(()=>{ poll(); flash('已加入 '+item.name); });
}
function removeItem(code){ post('/api/remove',{code,qty:1}).then(poll); }

/* ---------- 餐盘 / 订单 ---------- */
function renderTray(){
  const cart=STATE.cart||[];
  const tray=$('tray');
  if(!cart.length){ tray.innerHTML='<div class="empty">餐盘是空的<br>点圆卡或按 Enter 加入</div>'; }
  else{
    tray.innerHTML=cart.map(i=>{
      const c=CATALOG.find(x=>x.code===i.code)||{};
      const src=c.localImg||c.image||'';
      return `<div class="titem" data-code="${esc(i.code)}" title="${esc(i.name)}">
        <img src="${esc(src)}" alt="" onerror="this.style.display='none'">
        <span class="q">${i.qty}</span></div>`;
    }).join('');
    tray.querySelectorAll('.titem').forEach(el=>{
      el.onclick=()=>removeItem(el.dataset.code);
    });
  }

  const lines=$('lines');
  if(!cart.length){ lines.innerHTML='<div class="empty">还没有选餐</div>'; }
  else{
    lines.innerHTML=cart.map(i=>`<div class="line">
      <span class="n">${esc(i.name)}</span>
      <span class="x">×${i.qty}</span>
      <span class="v">¥${fmt(i.subtotal)}</span></div>`).join('');
  }

  const p=STATE.price||{};
  $('orig').textContent='¥'+fmt(p.original);
  $('disc').textContent='¥'+fmt(p.discount);
  $('pay').textContent=fmt(p.payable);
  $('saveTag').textContent=(p.discount>0?'· 已优惠':'');
  $('btnConfirm').disabled=!cart.length;
  $('btnClear').disabled=!cart.length;
}

function renderStat(){
  const on=!!(CATALOG.length);
  $('stat').classList.toggle('on',on);
  $('statTxt').textContent=on?'在线 · 麦当劳 MCP':'连接中';
}

/* ---------- 轮询同步 ---------- */
async function poll(){
  try{
    const r=await fetch('/api/state');
    STATE=await r.json();
    renderOrbs(); renderTray(); renderStat();
  }catch(e){}
}

/* ---------- 旋钮 / 键盘 ---------- */
function rotate(delta){
  const L=list(); if(!L.length) return;
  BASE=((BASE+delta)%L.length+L.length)%L.length;
  const item=L[BASE];
  STATE.selected=item.name;      // 先本地同步, 否则 renderOrbs 会被旧 selected 覆盖回原位
  renderOrbs();
  post('/api/select',{index:CATALOG.indexOf(item)});
}
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  if(/^[1-9]$/.test(e.key)){                 // 数字键 1-5 切分类
    const i=parseInt(e.key,10)-1;
    if(i<ROLES.length){ e.preventDefault(); setRole(ROLES[i][0]); }
    return;
  }
  if(e.key==='ArrowLeft'){ e.preventDefault(); rotate(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); rotate(1); }
  else if(e.key==='Enter'){
    const L=list(); const cur=L[BASE];
    if(cur){ e.preventDefault(); addItem(cur); }
  }
});

/* ---------- 确认 / 清空 / AI 配单 ---------- */
$('btnClear').onclick=()=>post('/api/clear').then(()=>{ poll(); flash('餐盘已清空'); });
$('btnConfirm').onclick=()=>{
  post('/api/key',{key:8}).then(r=>{
    const p=(r&&r.price)||STATE.price||{};
    flash(`已确认 · 应付 ${fmt(p.payable)} 元`+(p.discount>0?` · 省 ${fmt(p.discount)} 元`:''),'ok');
    poll();
  });
};
$('engSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  ENGINE=b.dataset.e;
  $('engSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});
$('btnPlan').onclick=()=>{
  const msg=$('msg'); msg.className='msg'; msg.textContent='生成中...';
  $('btnPlan').disabled=true;
  post('/api/plan',{people:$('people').value,budget:$('budget').value,engine:ENGINE,avoid:''})
    .then(r=>{
      $('btnPlan').disabled=false;
      if(r&&r.error){ msg.className='msg err'; msg.textContent='失败: '+r.error+(r.note?('（'+r.note+'）'):''); }
      else{
        msg.className='msg ok';
        msg.textContent=`已生成 · 应付 ${fmt(r.payable)} 元`+
          (r.discount>0?` · 省 ${fmt(r.discount)} 元`:'')+
          (r.balance>0?` · 再加 ${fmt(r.balance)} 元可解锁 ${r.next}`:'')+
          (r.engine==='llm'?` · ${r.model} 选餐`:r.note?` · ${r.note}`:'');
      }
      poll();
    });
};

let flashTimer=null;
function flash(text,type){
  const msg=$('msg'); msg.className='msg '+(type||'');
  msg.textContent=text;
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{ if(!$('btnPlan').disabled) msg.textContent=''; },2600);
}

/* ---------- 启动 ---------- */
(async function init(){
  try{
    const r=await fetch('/api/menu'); const d=await r.json();
    CATALOG=d.catalog||[];
    await poll();
    renderTabs(); renderOrbs();
  }catch(e){
    $('statTxt').textContent='未连接';
  }
})();
window.addEventListener('resize',()=>{ renderOrbs(); });
setInterval(poll,1100);
</script>
